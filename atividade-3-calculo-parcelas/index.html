<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3 - Cálculo de Parcelas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Calculadora de Parcelas</h1>
        <p class="descricao">
            Informe o valor da compra, o número de parcelas e a taxa de juros mensal.
        </p>

        <form id="compraForm">
            <label for="valorCompra">Valor total da compra:</label>
            <input type="number" id="valorCompra" name="valorCompra" min="0" step="0.01" required>

            <label for="parcelas">Número de parcelas:</label>
            <input type="number" id="parcelas" name="parcelas" min="1" step="1" required>

            <label for="taxaJuros">Taxa de juros mensal (%):</label>
            <input type="number" id="taxaJuros" name="taxaJuros" min="0" step="0.01" required>

            <button type="submit">Calcular Parcelas</button>
        </form>

        <section class="resultado">
            <p>Valor de cada parcela: <strong><span id="valorParcela">-</span></strong></p>
            <p>Valor total a pagar: <strong><span id="valorTotal">-</span></strong></p>
        </section>
    </main>
</body>
</html>
